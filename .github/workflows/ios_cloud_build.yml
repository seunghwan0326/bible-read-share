name: BibleReadShare Auto Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ios_cloud_build.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bible-auto-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap source once from ZIP
        shell: bash
        run: |
          if [ ! -f app/pubspec.yaml ]; then
            echo "First run: extracting current source into app/"
            rm -rf app
            mkdir app
            unzip -q BibleReadShare_Flutter_V1_2_1_NETWORK_FIX.zip -d app

            # Keep only source/config files needed for ongoing development.
            rm -rf app/.github
            rm -f app/bible_android_pwa_release*.yml
            rm -f app/codemagic.yaml
            rm -f app/setup_windows.ps1

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app
            git commit -m "chore: bootstrap Flutter source for automatic releases" || true
            git push origin main || true
          else
            echo "app/ source already exists; no bootstrap needed."
          fi

      - name: Generate Android and Web platform files
        working-directory: app
        run: |
          flutter create \
            --platforms=android,web \
            --org com.biblereadshare \
            --project-name bible_read_share \
            .
          rm -rf test

      - name: Configure Android network and app identity
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in text:
              text = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    ' + permission,
                  text,
                  count=1,
              )

          text = text.replace(
              'android:label="bible_read_share"',
              'android:label="함께읽는성경"',
          )
          manifest.write_text(text, encoding="utf-8")

          if 'android.permission.INTERNET' not in text:
              raise SystemExit("INTERNET permission missing")
          PY

      - name: Restore permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: app
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/bible-release-key.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=bibleupload
          storeFile=../bible-release-key.jks
          EOF

      - name: Configure permanent release signing
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          preamble = """import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """.replace("          ", "")

          if "val keystoreProperties = Properties()" not in text:
              text = preamble + text

          signing = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """

          if 'create("release")' not in text:
              marker = "    buildTypes {"
              if marker not in text:
                  raise SystemExit("buildTypes marker missing")
              text = text.replace(marker, signing + marker, 1)

          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          p.write_text(text, encoding="utf-8")
          PY

      - name: Verify Supabase DNS
        run: |
          python3 - <<'PY'
          import socket
          host = "fwvsospcusbuksdihcbs.supabase.co"
          result = socket.getaddrinfo(host, 443)
          if not result:
              raise SystemExit("Supabase DNS lookup failed")
          print("Supabase DNS OK")
          PY

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Build permanently signed Android APK
        working-directory: app
        run: |
          flutter build apk --release \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: Verify APK signature
        working-directory: app
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Configure Web PWA identity
        working-directory: app
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("web/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["name"] = "함께읽는성경"
          manifest["short_name"] = "함께읽는성경"
          manifest["description"] = "성경 읽기 진도와 기도제목을 함께 나누는 앱"
          manifest["display"] = "standalone"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          index = Path("web/index.html")
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              "<title>bible_read_share</title>",
              "<title>함께읽는성경</title>",
          )
          index.write_text(text, encoding="utf-8")
          PY

      - name: Build Web PWA
        working-directory: app
        run: |
          flutter build web --release \
            --base-href /bible-read-share/app/

      - name: Prepare fixed-URL distribution site
        run: |
          rm -rf _site
          mkdir -p _site/app

          cp -R app/build/web/* _site/app/
          cp app/build/app/outputs/flutter-apk/app-release.apk \
            _site/BibleReadShare-Android.apk

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>함께읽는성경 설치</title>
          </head>
          <body style="font-family:sans-serif;max-width:620px;margin:0 auto;padding:30px">
            <h1>📖 함께읽는성경</h1>

            <div id="android" style="display:none">
              <h2>Android</h2>
              <p><a href="./BibleReadShare-Android.apk">Android 앱 다운로드</a></p>
            </div>

            <div id="ios" style="display:none">
              <h2>iPhone / iPad</h2>
              <p><a href="./app/">iPhone에서 성경앱 열기</a></p>
              <p>Safari → 공유 → 홈 화면에 추가</p>
            </div>

            <div id="other" style="display:none">
              <p><a href="./BibleReadShare-Android.apk">Android APK</a></p>
              <p><a href="./app/">iPhone / 웹앱</a></p>
            </div>

            <script>
              const ua = navigator.userAgent || "";
              const id =
                /iPhone|iPad|iPod/i.test(ua) ? "ios" :
                /Android/i.test(ua) ? "android" : "other";
              document.getElementById(id).style.display = "block";
            </script>
          </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
